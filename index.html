        // --- MAIN APP COMPONENT ---

            const [darkMode, setDarkMode] = useState(false);
            const [activeTab, setActiveTab] = useState('home'); // home, profile, friends, groups, notifications
            const [currentUser, setCurrentUser] = useState(DEMO_USERS[0]);
            
            // App Core States
            const [posts, setPosts] = useState(INITIAL_POSTS);
            const [stories, setStories] = useState(INITIAL_STORIES);
            const [groups, setGroups] = useState(INITIAL_GROUPS);
            const [notifications, setNotifications] = useState(INITIAL_NOTIFICATIONS);
            const [usersList, setUsersList] = useState(DEMO_USERS);
            const [friendRequests, setFriendRequests] = useState([
                { id: 'fr1', name: 'Tanvir Ahmed', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80', mutual: 14 }
            ]);

            // Interactive UI Modals & Drawers
            const [activeStoryModal, setActiveStoryModal] = useState(null);
            const [isCreatePostOpen, setIsCreatePostOpen] = useState(false);
            const [isEditProfileOpen, setIsEditProfileOpen] = useState(false);
            const [isCreateGroupOpen, setIsCreateGroupOpen] = useState(false);
            const [activeChatUser, setActiveChatUser] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedTag, setSelectedTag] = useState('');
            const [activeReactionPostId, setActiveReactionPostId] = useState(null);

            // Toast Alert state
            const [toast, setToast] = useState(null);

            const t = I18N[lang];

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            // Toggle Dark Mode
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            // Handle Post Creation
            const handleAddPost = (newPostData) => {
                const newPost = {
                    id: 'p_' + Date.now(),
                    userId: currentUser.id,
                    authorName: currentUser.name,
                    authorAvatar: currentUser.avatar,
                    timestamp: 'Just now',
                    content: newPostData.content,
                    image: newPostData.image || null,
                    reactions: { like: 0, love: 0, haha: 0, wow: 0, sad: 0, angry: 0 },
                    userReaction: null,
                    comments: [],
                    sharesCount: 0,
                    privacy: newPostData.privacy || 'public'
                };
                setPosts([newPost, ...posts]);
                setIsCreatePostOpen(false);
                showToast(lang === 'en' ? 'Post published successfully!' : 'পোস্ট সফলভাবে প্রকাশিত হয়েছে!');
            };

            // Handle Post Reaction
            const handleReaction = (postId, reactionType) => {
                setPosts(posts.map(post => {
                    if (post.id === postId) {
                        const updatedReactions = { ...post.reactions };
                        
                        // If user already reacted with same type, remove it
                        if (post.userReaction === reactionType) {
                            updatedReactions[reactionType] = Math.max(0, updatedReactions[reactionType] - 1);
                            return { ...post, reactions: updatedReactions, userReaction: null };
                        }

                        // Remove existing reaction if any
                        if (post.userReaction) {
                            updatedReactions[post.userReaction] = Math.max(0, updatedReactions[post.userReaction] - 1);
                        }

                        // Add new reaction
                        updatedReactions[reactionType] = (updatedReactions[reactionType] || 0) + 1;
                        return { ...post, reactions: updatedReactions, userReaction: reactionType };
                    }
                    return post;
                }));
                setActiveReactionPostId(null);
            };

            // Add Comment to Post
            const handleAddComment = (postId, commentText) => {
                if (!commentText.trim()) return;
                setPosts(posts.map(p => {
                    if (p.id === postId) {
                        const newComment = {
                            id: 'c_' + Date.now(),
                            userId: currentUser.id,
                            userName: currentUser.name,
                            userAvatar: currentUser.avatar,
                            text: commentText,
                            timestamp: 'Just now'
                        };
                        return { ...p, comments: [...p.comments, newComment] };
                    }
                    return p;
                }));
            };

            // Handle Story Upload
            const handleAddStory = (mediaUrl) => {
                const newStory = {
                    id: 's_' + Date.now(),
                    userId: currentUser.id,
                    name: currentUser.name.split(' ')[0],
                    avatar: currentUser.avatar,
                    media: mediaUrl || 'https://images.unsplash.com/photo-1518684079-3c830dcef090?w=600&auto=format&fit=crop&q=80',

                setStories([newStory, ...stories]);
                showToast(lang === 'en' ? 'Story added successfully!' : 'স্টোরি যুক্ত করা হয়েছে!');
            };

            // Switch Demo Accounts
            const handleSwitchUser = (user) => {

                return post.content.toLowerCase().includes(query) || post.authorName.toLowerCase().includes(query);

                            <i class="fa-solid fa-circle-check"></i>
                            <span>{toast}</span>
                        </div>
                    )}

                    {/* TOP NAVBAR */}
                    <header class="sticky top-0 z-40 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shadow-sm px-4 py-2 flex items-center justify-between">
                        {/* Left Logo & Search */}
                        <div class="flex items-center gap-3">
                            <div class="flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div class="w-10 h-10 rounded-full bg-bdGreen-500 text-white font-bold text-xl flex items-center justify-center shadow-md">
                                    BD
                                </div>
                                <span class="hidden sm:inline font-bold text-xl tracking-tight text-bdGreen-600 dark:text-bdGreen-500">
                                    Connect<span class="text-bdRed-500">BD</span>
                                </span>
                            </div>
                            <div class="relative flex items-center">
                                <i class="fa-solid fa-magnifying-glass absolute left-3 text-gray-400"></i>
                                <input 
                                    type="text" 
                                    placeholder={t.searchPlaceholder}
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    class="pl-9 pr-4 py-2 bg-gray-100 dark:bg-gray-700 rounded-full text-sm w-40 sm:w-64 focus:outline-none focus:ring-2 focus:ring-bdGreen-500 dark:text-gray-100"
                                />
                                {(searchQuery || selectedTag) && (
                                    <button onClick={() => { setSearchQuery(''); setSelectedTag(''); }} class="absolute right-3 text-xs text-gray-400 hover:text-gray-600">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Navigation Tabs (Desktop Center) */}
                        <nav class="hidden md:flex items-center gap-2">
                            {[
                                { id: 'home', icon: 'fa-house', label: t.home },
                                { id: 'friends', icon: 'fa-user-group', label: t.friends },
                                { id: 'groups', icon: 'fa-users', label: t.groups },
                                { id: 'notifications', icon: 'fa-bell', label: t.notifications, badge: notifications.filter(n => !n.read).length }
                            ].map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    class={`relative px-5 py-2.5 rounded-lg flex items-center gap-2 font-medium transition-all ${
                                        activeTab === tab.id 
                                        ? 'text-bdGreen-600 dark:text-bdGreen-500 bg-bdGreen-50 dark:bg-gray-700 border-b-2 border-bdGreen-500' 
                                        : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'
                                    }`}

                                    <i class={`fa-solid ${tab.icon} text-lg`}></i>
                                    {tab.badge > 0 && (
                                        <span class="absolute top-1 right-2 bg-bdRed-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold">
                                            {tab.badge}
                                        </span>
                                    )}
                                </button>
                            ))}
                        </nav>

                        {/* Right Tools & Profile Switcher */}
                        <div class="flex items-center gap-2 sm:gap-3">
                            {/* Language Switcher */}
                            <button 
                                onClick={() => setLang(lang === 'en' ? 'bn' : 'en')} 
                                class="px-2.5 py-1.5 rounded-full text-xs font-semibold bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition"
                                title="Switch Language"
                            >
                                <i class="fa-solid fa-globe mr-1"></i>
                                {t.language}
                            </button>

                            {/* Dark Mode Toggle */}
                            <button 
                                onClick={() => setDarkMode(!darkMode)}

                    {/* STORY VIEWER MODAL */}
                    {activeStoryModal && (
                        <div class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <button onClick={() => setActiveStoryModal(null)} class="absolute top-4 right-4 text-white text-2xl hover:text-gray-300">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                            <div class="relative max-w-sm w-full h-[500px] rounded-2xl overflow-hidden">
                                <img src={activeStoryModal.media} class="w-full h-full object-cover" />
                                <div class="absolute top-4 left-4 flex items-center gap-3">
                                    <img src={activeStoryModal.avatar} class="w-9 h-9 rounded-full border-2 border-bdGreen-500" />
                                    <span class="text-white font-semibold text-sm drop-shadow">{activeStoryModal.name}</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CREATE POST MODAL */}
                    {isCreatePostOpen && (
                        <CreatePostModal 
                            t={t}
                            currentUser={currentUser}
                            onClose={() => setIsCreatePostOpen(false)}
                            onSubmit={handleAddPost}
                        />
                    )}

                    {/* EDIT PROFILE MODAL */}
                    {isEditProfileOpen && (
                        <EditProfileModal 
                            t={t}
                            currentUser={currentUser}
                            onClose={() => setIsEditProfileOpen(false)}
                            onSave={(updatedData) => {
                                setCurrentUser({ ...currentUser, ...updatedData });
                                setIsEditProfileOpen(false);
                                showToast('Profile updated!');
                            }}
                        />
                    )}

                    {/* CREATE GROUP MODAL */}
                    {isCreateGroupOpen && (
                        <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                            <div class="bg-white dark:bg-gray-800 rounded-xl p-5 w-full max-w-md space-y-4">
                                <h3 class="font-bold text-lg">Create New Community Group</h3>
                                <input type="text" placeholder="Group Name" id="gName" class="w-full p-2.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm" />
                                <select id="gCat" class="w-full p-2.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600 text-sm">
                                    <option value="Technology">Technology</option>
                                    <option value="Travel">Travel & Tourism</option>
                                    <option value="Sports">Sports & Cricket</option>
                                    <option value="General">General BD Community</option>
                                </select>
                                <div class="flex justify-end gap-2">
                                    <button onClick={() => setIsCreateGroupOpen(false)} class="px-4 py-2 rounded-lg text-sm bg-gray-200 dark:bg-gray-700">Cancel</button>
                                    <button 
                                        onClick={() => {
                                            const name = document.getElementById('gName').value;
                                            const cat = document.getElementById('gCat').value;
                                            if (name) {
                                                setGroups([...groups, {
                                                    id: 'g_' + Date.now(),
                                                    name,
                                                    members: '1 member',
                                                    cover: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=400&auto=format&fit=crop&q=80',
                                                    category: cat,
                                                    joined: true
                                                }]);
                                                setIsCreateGroupOpen(false);
                                                showToast('Group created successfully!');
                                            }
                                        }}
                                        class="px-4 py-2 rounded-lg text-sm bg-bdGreen-600 text-white font-semibold"
                                    >
                                        Create
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MESSENGER POPUP DRAWER */}
                    {activeChatUser && (
                        <MessengerDrawer 
                            user={activeChatUser} 
                            currentUser={currentUser}
                            onClose={() => setActiveChatUser(null)}
                            t={t}
                        />
                    )}
                </div>
            );
        }

        // --- SUB-COMPONENT: POST CARD ---
        function PostCard({ post, t, currentUser, onReaction, onComment, activeReactionPostId, setActiveReactionPostId, showToast }) {
            const [commentInput, setCommentInput] = useState('');
            const [showComments, setShowComments] = useState(false);

            const reactionIcons = {
                like: { icon: 'fa-thumbs-up', color: 'text-blue-500', label: 'Like' },
                love: { icon: 'fa-heart', color: 'text-red-500', label: 'Love' },
                haha: { icon: 'fa-face-laugh-squint', color: 'text-amber-500', label: 'Haha' },
                wow: { icon: 'fa-face-surprise', color: 'text-amber-500', label: 'Wow' },
                sad: { icon: 'fa-face-sad-tear', color: 'text-amber-500', label: 'Sad' },
                angry: { icon: 'fa-face-angry', color: 'text-red-600', label: 'Angry' }
            };

            const totalReactions = Object.values(post.reactions).reduce((a, b) => a + b, 0);

            return (
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-4 space-y-3">
                    {/* Header */}
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src={post.authorAvatar} class="w-10 h-10 rounded-full object-cover" />
                            <div>
                                <h4 class="font-semibold text-sm leading-tight">{post.authorName}</h4>
                                <span class="text-xs text-gray-400 flex items-center gap-1">
                                    {post.timestamp} • <i class="fa-solid fa-earth-americas text-[10px]"></i>
                                </span>
                            </div>
                        </div>
                        <button onClick={() => showToast('Post reported for moderation review.')} class="text-gray-400 hover:text-gray-600 p-1">
                            <i class="fa-solid fa-ellipsis"></i>
                        </button>
                    </div>

                    {/* Content */}
                    <p class="text-sm leading-relaxed whitespace-pre-line">{post.content}</p>

                    {/* Optional Image */}
                    {post.image && (
                        <div class="rounded-lg overflow-hidden max-h-96 bg-black/5">
                            <img src={post.image} class="w-full h-full object-cover" />
                        </div>
                    )}

                    {/* Reaction & Comment Count Stats Bar */}
                    <div class="flex items-center justify-between text-xs text-gray-500 py-1 border-b border-gray-100 dark:border-gray-700">
                        <div class="flex items-center gap-1">
                            <span class="flex -space-x-1">
                                <span class="w-4 h-4 rounded-full bg-blue-500 text-white flex items-center justify-center text-[8px]"><i class="fa-solid fa-thumbs-up"></i></span>
                                <span class="w-4 h-4 rounded-full bg-red-500 text-white flex items-center justify-center text-[8px]"><i class="fa-solid fa-heart"></i></span>
                            </span>
                            <span>{totalReactions}</span>
                        </div>
                        <div class="flex gap-3">
                            <button onClick={() => setShowComments(!showComments)}>{post.comments.length} {t.comment}s</button>
                            <span>{post.sharesCount} {t.share}s</span>
                        </div>
                    </div>

                    {/* Reaction Buttons Row */}
                    <div class="relative flex items-center justify-around text-xs font-semibold text-gray-600 dark:text-gray-300 pt-1">
                        
                        {/* Reaction Picker Popup */}
                        {activeReactionPostId === post.id && (
                            <div class="absolute -top-10 left-2 bg-white dark:bg-gray-700 rounded-full px-3 py-1.5 shadow-xl border dark:border-gray-600 flex gap-3 reaction-popup z-30">
                                {Object.keys(reactionIcons).map(type => (
                                    <button 
                                        key={type}
                                        onClick={() => onReaction(post.id, type)}
                                        class="hover:scale-125 transition duration-150 text-base"
                                    >
                                        <i class={`fa-solid ${reactionIcons[type].icon} ${reactionIcons[type].color}`}></i>
                                    </button>
                                ))}
                            </div>
                        )}

                        <button 
                            onMouseEnter={() => setActiveReactionPostId(post.id)}
                            onClick={() => onReaction(post.id, post.userReaction ? post.userReaction : 'like')}
                            class="flex items-center gap-1.5 py-1.5 px-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition"
                        >
                            {post.userReaction ? (
                                <>
                                    <i class={`fa-solid ${reactionIcons[post.userReaction].icon} ${reactionIcons[post.userReaction].color}`}></i>
                                    <span class={reactionIcons[post.userReaction].color}>{reactionIcons[post.userReaction].label}</span>
                                </>
                            ) : (
                                <>
                                    <i class="fa-regular fa-thumbs-up text-lg"></i>
                                    <span>{t.like}</span>
                                </>
                            )}
                        </button>

                        <button onClick={() => setShowComments(!showComments)} class="flex items-center gap-1.5 py-1.5 px-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <i class="fa-regular fa-comment text-lg"></i>
                            <span>{t.comment}</span>
                        </button>

                        <button onClick={() => showToast('Post link copied to clipboard!')} class="flex items-center gap-1.5 py-1.5 px-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                            <i class="fa-solid fa-share text-lg"></i>
                            <span>{t.share}</span>
                        </button>
                    </div>

                    {/* COMMENTS SECTION */}
                    {showComments && (
                        <div class="space-y-3 pt-2 border-t border-gray-100 dark:border-gray-700">
                            {/* Input */}
                            <div class="flex items-center gap-2">
                                <img src={currentUser.avatar} class="w-8 h-8 rounded-full object-cover" />
                                <div class="flex-1 flex items-center bg-gray-100 dark:bg-gray-700 rounded-full px-3 py-1.5">
                                    <input 
                                        type="text" 
                                        placeholder={t.writeComment}
                                        value={commentInput}
                                        onChange={(e) => setCommentInput(e.target.value)}
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') {
                                                onComment(post.id, commentInput);
                                                setCommentInput('');
                                            }
                                        }}
                                        class="bg-transparent border-none text-xs flex-1 focus:outline-none dark:text-gray-100"
                                    />
                                    <button 
                                        onClick={() => {
                                            onComment(post.id, commentInput);
                                            setCommentInput('');
                                        }} 
                                        class="text-bdGreen-600 text-xs font-semibold ml-2"
                                    >
                                        Post
                                    </button>
                                </div>
                            </div>

                            {/* Comment List */}
                            <div class="space-y-2 max-h-48 overflow-y-auto">
                                {post.comments.map(c => (
                                    <div key={c.id} class="flex items-start gap-2">
                                        <img src={c.userAvatar} class="w-7 h-7 rounded-full object-cover mt-1" />
                                        <div class="bg-gray-100 dark:bg-gray-700 p-2.5 rounded-2xl text-xs max-w-[85%]">
                                            <span class="font-bold block">{c.userName}</span>
                                            <p class="mt-0.5">{c.text}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- SUB-COMPONENT: CREATE POST MODAL ---
        function CreatePostModal({ t, currentUser, onClose, onSubmit }) {
            const [content, setContent] = useState('');
            const [image, setImage] = useState('');

            return (
                <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-800 rounded-xl max-w-lg w-full p-4 space-y-4 shadow-xl">
                        <div class="flex items-center justify-between border-b pb-2 dark:border-gray-700">
                            <h3 class="font-bold text-lg">{t.createPost}</h3>
                            <button onClick={onClose} class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="flex items-center gap-3">
                            <img src={currentUser.avatar} class="w-10 h-10 rounded-full object-cover" />
                            <div>
                                <h4 class="font-semibold text-sm">{currentUser.name}</h4>
                                <span class="text-xs bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded text-gray-500">Public 🌐</span>
                            </div>
                        </div>
                        <textarea 
                            rows="4" 
                            placeholder={t.createPost}
                            value={content}
                            onChange={(e) => setContent(e.target.value)}
                            class="w-full p-2 bg-transparent focus:outline-none text-sm dark:text-gray-100 resize-none"
                        ></textarea>
                        <input 
                            type="text" 
                            placeholder="Optional Image URL (https://...)" 
                            value={image}
                            onChange={(e) => setImage(e.target.value)}
                            class="w-full text-xs p-2.5 rounded-lg border dark:bg-gray-700 dark:border-gray-600"
                        />
                        <button 
                            disabled={!content.trim()}
                            onClick={() => onSubmit({ content, image })}
                            class="w-full bg-bdGreen-600 text-white font-semibold py-2 rounded-lg text-sm disabled:opacity-50 hover:bg-bdGreen-700 transition"
                        >
                            {t.post}
                        </button>
                    </div>
                </div>
            );
        }

        // --- SUB-COMPONENT: EDIT PROFILE MODAL ---
        function EditProfileModal({ t, currentUser, onClose, onSave }) {
            const [name, setName] = useState(currentUser.name);
            const [bio, setBio] = useState(currentUser.bio);
            const [location, setLocation] = useState(currentUser.location);
            const [avatar, setAvatar] = useState(currentUser.avatar);
            const [cover, setCover] = useState(currentUser.cover);

            return (
                <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-800 rounded-xl max-w-md w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                        <div class="flex items-center justify-between border-b pb-2 dark:border-gray-700">
                            <h3 class="font-bold text-lg">{t.editProfile}</h3>
                            <button onClick={onClose} class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="space-y-3 text-xs">
                            <div>
                                <label class="font-semibold block mb-1">Name</label>
                                <input type="text" value={name} onChange={(e) => setName(e.target.value)} class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600" />
                            </div>
                            <div>
                                <label class="font-semibold block mb-1">{t.bio}</label>
                                <textarea value={bio} onChange={(e) => setBio(e.target.value)} class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600"></textarea>
                            </div>
                            <div>
                                <label class="font-semibold block mb-1">{t.location}</label>
                                <input type="text" value={location} onChange={(e) => setLocation(e.target.value)} class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600" />
                            </div>
                            <div>
                                <label class="font-semibold block mb-1">{t.profilePhoto} URL</label>
                                <input type="text" value={avatar} onChange={(e) => setAvatar(e.target.value)} class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600" />
                            </div>
                            <div>
                                <label class="font-semibold block mb-1">{t.coverPhoto} URL</label>
                                <input type="text" value={cover} onChange={(e) => setCover(e.target.value)} class="w-full p-2 rounded border dark:bg-gray-700 dark:border-gray-600" />
                            </div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onClick={onClose} class="px-4 py-1.5 rounded text-xs bg-gray-200 dark:bg-gray-700">Cancel</button>
                            <button onClick={() => onSave({ name, bio, location, avatar, cover })} class="px-4 py-1.5 rounded text-xs bg-bdGreen-600 text-white font-semibold">{t.saveChanges}</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- SUB-COMPONENT: REAL-TIME SIMULATED MESSENGER DRAWER ---
        function MessengerDrawer({ user, currentUser, onClose, t }) {
            const [messages, setMessages] = useState([
                { id: 'm1', sender: user.id, text: 'Assalamu Alaikum! How are you doing today?', time: '10:00 AM' }
            ]);
            const [inputText, setInputText] = useState('');

            const sendMessage = () => {
                if (!inputText.trim()) return;
                const newMsg = { id: 'm_' + Date.now(), sender: currentUser.id, text: inputText, time: 'Just now' };
                setMessages([...messages, newMsg]);
                setInputText('');

                // Automated reply simulation
                setTimeout(() => {
                    setMessages(prev => [...prev, {
                        id: 'm_reply_' + Date.now(),
                        sender: user.id,
                        text: 'Thanks for reaching out! ConnectBD messenger is super smooth 🚀',
                        time: 'Just now'
                    }]);
                }, 1200);
            };

            return (
                <div class="fixed bottom-0 right-4 z-50 w-80 sm:w-96 bg-white dark:bg-gray-800 rounded-t-xl shadow-2xl border border-gray-200 dark:border-gray-700 flex flex-col h-96">
                    {/* Header */}
                    <div class="p-3 bg-bdGreen-600 text-white rounded-t-xl flex items-center justify-between shadow">
                        <div class="flex items-center gap-2">
                            <img src={user.avatar} class="w-8 h-8 rounded-full object-cover border" />
                            <div>
                                <h4 class="font-bold text-xs">{user.name}</h4>
                                <span class="text-[10px] opacity-80">{t.activeNow}</span>
                            </div>
                        </div>
                        <button onClick={onClose} class="hover:text-gray-200"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    {/* Messages Body */}
                    <div class="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
                        {messages.map(m => (
                            <div key={m.id} class={`flex ${m.sender === currentUser.id ? 'justify-end' : 'justify-start'}`}>
                                <div class={`max-w-[75%] p-2.5 rounded-xl ${m.sender === currentUser.id ? 'bg-bdGreen-500 text-white rounded-br-none' : 'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-bl-none'}`}>
                                    <p>{m.text}</p>
                                    <span class="text-[9px] opacity-60 block text-right mt-1">{m.time}</span>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Input Area */}
                    <div class="p-2 border-t dark:border-gray-700 flex items-center gap-2">
                        <input 
                            type="text" 
                            placeholder={t.typeMessage}
                            value={inputText}
                            onChange={(e) => setInputText(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && sendMessage()}
                            class="flex-1 text-xs bg-gray-100 dark:bg-gray-700 rounded-full px-3 py-2 focus:outline-none dark:text-gray-100"
                        />
                        <button onClick={sendMessage} class="w-8 h-8 rounded-full bg-bdGreen-500 text-white flex items-center justify-center text-xs">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
